<style>
html{background:#fbfaf6;color:#1b2127}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
main{width:min(360px,calc(100vw - 48px));padding:0 0 12vh}
.logo{display:block;margin:0 0 22px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;padding-top:14px;border-top:2px solid #1b2127}
p{margin:0 0 18px;color:#47525c}
label{display:block;margin:0 0 6px;font:600 11px/1.4 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#47525c}
input[type=password]{box-sizing:border-box;width:100%;padding:10px 12px;font:17px/1.3 "Segoe UI",system-ui,sans-serif;color:#1b2127;
  background:#fffefb;border:1px solid #cdc6b8;border-radius:0}
input[type=password]:focus{outline:2px solid #1d6b45;outline-offset:-1px;border-color:#1d6b45}
.keep{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font:14px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:0;
  text-transform:none;font-weight:400;cursor:pointer}
.keep input{width:16px;height:16px;margin:0;accent-color:#1d6b45}
button{padding:11px 18px;font:600 13px/1 "Segoe UI",system-ui,sans-serif;color:#fbfaf6;background:#1b2127;border:1px solid #1b2127;
  border-radius:0;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.5em;margin:14px 0 0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#b4513a}
#wait{font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#79828b}
</style>
</head>

<main>
<p id="wait">Opening…</p>
<form id="gate" hidden>

<h1>Private pages</h1>
<p>Enter the password to open them.</p>
<label for="pw">Password</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required>
<label class="keep"><input id="keep" type="checkbox" checked> Keep me signed in on this device</label>
<button id="go" type="submit">Open</button>
<p id="msg" role="alert"></p>
</form>

<script>
(function () {
  'use strict';
  var SALT = 'cpaIpxi/jraPwOab4wuhKw==', ITER = 600000, NAME = 'rr-site-key';

  var pw = document.getElementById('pw'), keep = document.getElementById('keep'), go = document.getElementById('go');

  function keepKey(v, stay) { try { sessionStorage.setItem(NAME, v); if (stay) localStorage.setItem(NAME, v); } catch (err) { /* no storage: ask on every page */ } }
  function forget() { try { sessionStorage.removeItem(NAME); localStorage.removeItem(NAME); } catch (err) { /* nothing kept */ } }
