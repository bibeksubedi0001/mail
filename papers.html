<style>
html{background:#fbfaf6;color:#1b2127}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
main{width:min(360px,calc(100vw - 48px));padding:0 0 12vh}
.logo{display:block;margin:0 0 22px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;padding-top:14px;border-top:2px solid #1b2127}
p{margin:0 0 18px;color:#47525c}
label{display:block;margin:0 0 6px;font:600 11px/1.4 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#47525c}
input[type=password]{box-sizing:border-box;width:100%;padding:10px 12px;font:17px/1.3 "Segoe UI",system-ui,sans-serif;color:#1b2127;
  background:#fffefb;border:1px solid #cdc6b8;border-radius:0}
input[type=password]:focus{outline:2px solid #1d6b45;outline-offset:-1px;border-color:#1d6b45}
.keep{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font:14px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:0;
  text-transform:none;font-weight:400;cursor:pointer}
.keep input{width:16px;height:16px;margin:0;accent-color:#1d6b45}
button{padding:11px 18px;font:600 13px/1 "Segoe UI",system-ui,sans-serif;color:#fbfaf6;background:#1b2127;border:1px solid #1b2127;
  border-radius:0;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.5em;margin:14px 0 0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#b4513a}
#wait{font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#79828b}
</style>
</head>

<main>
<p id="wait">Opening…</p>

<h1>Private pages</h1>
<p>Enter the password to open them.</p>
<label for="pw">Password</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required>
<label class="keep"><input id="keep" type="checkbox" checked> Keep me signed in on this device</label>
<button id="go" type="submit">Open</button>
<p id="msg" role="alert"></p>
</form>

<script>
(function () {
  'use strict';
  var SALT = 'cpaIpxi/jraPwOab4wuhKw==', ITER = 600000, NAME = 'rr-site-key';
  var gate = document.getElementById('gate'), wait = document.getElementById('wait'), msg = document.getElementById('msg');
  var pw = document.getElementById('pw'), keep = document.getElementById('keep'), go = document.getElementById('go');
  if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    location.replace('https:' + location.href.slice(5));  // the browser only decrypts on a secure page
    return;
  }
  function bytes(s) { s = atob(s); var a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function text(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function kept() { try { return sessionStorage.getItem(NAME) || localStorage.getItem(NAME); } catch (err) { return null; } }
  function keepKey(v, stay) { try { sessionStorage.setItem(NAME, v); if (stay) localStorage.setItem(NAME, v); } catch (err) { /* no storage: ask on every page */ } }
  function forget() { try { sessionStorage.removeItem(NAME); localStorage.removeItem(NAME); } catch (err) { /* nothing kept */ } }
  function ask(why) { wait.hidden = true; gate.hidden = false; msg.textContent = why || ''; go.disabled = false; pw.focus(); }
  function derive(password) {  // the key from the password: slow on purpose
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256'}, k, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  function open(raw) {  // this page, decrypted with the key; fails when the key is not the right one
    var data = bytes(document.getElementById('d').textContent);
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({name: 'AES-GCM', iv: data.subarray(0, 12)}, key, data.subarray(12));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(page) {  // not before the browser has read this page to its end: until then it ignores document.open()
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { show(page); }); return; }
    setTimeout(function () { document.open(); document.write(page); document.close(); }, 0);
  }
  function enter(password, stay) {
    return derive(password).then(function (raw) {
      return open(raw).then(function (page) { keepKey(text(raw), stay); show(page); });
    });
  }
  if (!window.crypto || !crypto.subtle || !window.TextDecoder) { ask('This browser cannot open the pages. Use a current browser.'); return; }
  gate.addEventListener('submit', function (ev) {
    ev.preventDefault();
    go.disabled = true; msg.textContent = '';
    enter(pw.value, keep.checked).catch(function () { ask('That password did not open the page.'); pw.select(); });
  });
  var link = /^#k=(.+)$/.exec(location.hash), have = kept();
  if (link) {  // a sign-in link carries the password after #k=; the browser does not send that part to the server
    history.replaceState(null, '', location.pathname + location.search);
    enter(decodeURIComponent(link[1]), true).catch(function () { ask('That link did not open the page.'); });
  } else if (have) {
    open(bytes(have)).then(show, function () { forget(); ask(''); });
  } else ask('');
})();
